            "primary-fixed": "#0acc80",

            "xl": "0.75rem",
            "full": "9999px"
          },

  <!-- Custom Hexagonal Presentation Styles -->
  <link rel="stylesheet" href="/src/presentation/styles/main.css" />
  <link rel="stylesheet" href="/src/presentation/styles/animations.css" />
</head>

<body class="bg-background text-on-surface font-body-md antialiased pb-32">
  <!-- React App Container -->
  <div id="root"></div>

  <!-- Search Modal -->
  <div 
    id="search-modal" 
    class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex-col items-center justify-start p-4 sm:p-6 pt-16"
  >
    <div class="w-full max-w-2xl bg-surface-container-low border border-primary/50 rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between gap-3 pb-4 border-b border-outline-variant/50">
        <div class="flex items-center gap-2 flex-1 bg-surface-container px-3 py-2 rounded-xl border border-outline-variant">
          <span class="material-symbols-outlined text-primary">search</span>
          <input 
            type="text" 
            id="menu-search-input"
            placeholder="Buscar por nombre, salsa o ingrediente..." 
            class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant focus:outline-none text-sm"
          />
        </div>
        <button 
          type="button" 
          id="close-search-btn"
          class="p-2 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-variant transition-colors"
        >
          <span class="material-symbols-outlined text-2xl">close</span>
        </button>
      </div>

      <div id="search-results-list" class="flex-1 overflow-y-auto custom-scrollbar pt-4 space-y-3">
        <p class="text-center text-xs text-on-surface-variant py-8">Escribe algo para buscar en toda la carta de Weekend!...</p>
      </div>
    </div>
  </div>

  <!-- Circular Floating Cart Button (All Devices) -->
  <button 
    type="button"
    id="cart-floating-fab"
    data-action="open-cart"
    class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-primary hover:bg-primary-container text-black flex items-center justify-center shadow-[0_4px_25px_rgba(10,204,128,0.45)] hover:scale-105 active:scale-95 transition-all duration-200"
    title="Ver Carrito de Compras"
  >
    <span class="material-symbols-outlined text-[26px]">shopping_cart</span>
    <span id="floating-cart-badge" class="absolute -top-1 -right-1 min-w-[22px] h-[22px] px-1 bg-black text-primary border-2 border-primary font-black text-[11px] rounded-full flex items-center justify-center hidden animate-bounce">
      0
    </span>
  </button>

  <!-- Main Composition Root Module -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
