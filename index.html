<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta name="google" content="notranslate" />
  <meta name="google-site-verification" content="QAHhxfz_zEf5BI70uxyBtlarH0Mc4VZmsSFX8_piEBg" />
  <title>WEEKEND! Lounge &amp; Restaurant - Menú Digital</title>
  
  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN & Theme Configuration -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "secondary-fixed": "#e2e2e2",
            "on-primary-container": "#3e5000",
            "surface-bright": "#393939",
            "on-background": "#e2e2e2",
            "surface-container-low": "#1b1b1b",
            "tertiary-fixed-dim": "#c8c6c5",
            "surface-dim": "#131313",
            "primary-fixed": "#ccf05f",
            "error-container": "#93000a",
            "on-tertiary-container": "#4a4949",
            "inverse-on-surface": "#303030",
            "on-error-container": "#ffdad6",
            "secondary-container": "#454747",
            "on-tertiary": "#313030",
            "tertiary-fixed": "#e5e2e1",
            "on-error": "#690005",
            "on-tertiary-fixed-variant": "#474746",
            "tertiary": "#d7d4d4",
            "primary-container": "#a4c639",
            "outline": "#8f937d",
            "primary": "#bfe353",
            "on-surface-variant": "#c5c9b1",
            "on-primary-fixed-variant": "#3c4d00",
            "surface-tint": "#b1d446",
            "on-primary": "#283500",
            "on-primary-fixed": "#161e00",
            "surface-variant": "#353535",
            "tertiary-container": "#bbb9b8",
            "on-surface": "#e2e2e2",
            "inverse-primary": "#506600",
            "surface-container-high": "#2a2a2a",
            "secondary-fixed-dim": "#c6c6c7",
            "on-tertiary-fixed": "#1c1b1b",
            "surface-container": "#1f1f1f",
            "on-secondary": "#2f3131",
            "outline-variant": "#454937",
            "error": "#ffb4ab",
            "background": "#131313",
            "surface-container-lowest": "#0e0e0e",
            "primary-fixed-dim": "#b1d446",
            "secondary": "#c6c6c7",
            "on-secondary-container": "#b4b5b5",
            "on-secondary-fixed-variant": "#454747",
            "inverse-surface": "#e2e2e2",
            "surface-container-highest": "#353535",
            "surface": "#131313",
            "on-secondary-fixed": "#1a1c1c"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin-desktop": "120px",
            "sm": "12px",
            "base": "8px",
            "xl": "64px",
            "md": "24px",
            "gutter": "16px",
            "lg": "40px",
            "margin-mobile": "16px",
            "xs": "4px"
          },
          "fontFamily": {
            "body-md": ["Montserrat", "sans-serif"],
            "display-lg": ["Montserrat", "sans-serif"],
            "headline-lg-mobile": ["Montserrat", "sans-serif"],
            "price-display": ["Space Grotesk", "sans-serif"],
            "headline-md": ["Montserrat", "sans-serif"],
            "label-bold": ["Space Grotesk", "sans-serif"],
            "body-lg": ["Montserrat", "sans-serif"],
            "headline-lg": ["Montserrat", "sans-serif"]
          },
          "fontSize": {
            "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "800" }],
            "price-display": ["22px", { "lineHeight": "1", "fontWeight": "700" }],
            "headline-md": ["20px", { "lineHeight": "1.3", "fontWeight": "700" }],
            "label-bold": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700" }],
            "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "500" }],
            "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "800" }]
          }
        }
      }
    };
  </script>

  <!-- Custom Hexagonal Presentation Styles -->
  <link rel="stylesheet" href="/src/presentation/styles/main.css" />
  <link rel="stylesheet" href="/src/presentation/styles/animations.css" />
</head>

<body class="bg-background text-on-surface font-body-md antialiased pb-32">
  <!-- TopAppBar -->
  <header class="fixed top-0 w-full z-50 bg-background/95 backdrop-blur-md border-b border-outline-variant flex justify-between items-center px-margin-mobile py-base shadow-sm">
    <div class="flex items-center gap-2">
      <button 
        type="button"
        onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
        class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150 p-2 flex items-center justify-center rounded-lg"
        title="Inicio"
      >
        <span class="material-symbols-outlined text-[26px]">restaurant_menu</span>
      </button>
      <div>
        <h1 class="text-headline-lg-mobile font-headline-lg-mobile tracking-tighter text-primary font-black flex items-center gap-1">
          WEEKEND!
        </h1>
        <span class="text-[10px] text-on-surface-variant font-bold tracking-widest block uppercase -mt-1">
          Lounge &amp; Restaurant
        </span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Search Trigger Button -->
      <button 
        type="button"
        data-action="open-search"
        class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150 p-2 flex items-center justify-center rounded-lg bg-surface-container border border-outline-variant/60 hover:border-primary"
        title="Buscar platos y bebidas"
      >
        <span class="material-symbols-outlined text-[22px]">search</span>
      </button>

      <!-- Cart Trigger in Top Bar (Desktop & Mobile) -->
      <button 
        type="button"
        data-action="open-cart"
        class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150 p-2 flex items-center justify-center rounded-lg bg-primary/10 border border-primary/40 hover:border-primary"
        title="Ver Carrito"
      >
        <span class="material-symbols-outlined text-[22px]">shopping_cart</span>
      </button>
    </div>
  </header>

  <!-- Sticky Category Chips Navigation -->
  <section class="overflow-x-auto no-scrollbar py-sm sticky top-16 z-40 bg-background/90 backdrop-blur-md border-b border-outline-variant/30">
    <div id="category-chips-nav" class="flex space-x-2 w-max px-margin-mobile">
      <!-- Injected dynamically by MenuController -->
    </div>
  </section>

  <!-- Main Canvas -->
  <main class="px-margin-mobile max-w-7xl mx-auto">
    <!-- Dynamic Menu Sections Container -->
    <div id="menu-sections-container">
      <!-- Injected dynamically by MenuController -->
    </div>
  </main>

  <!-- Search Modal -->
  <div 
    id="search-modal" 
    class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex-col items-center justify-start p-4 sm:p-6 pt-16"
  >
    <div class="w-full max-w-2xl bg-surface-container-low border border-primary/50 rounded-2xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between gap-3 pb-4 border-b border-outline-variant/50">
        <div class="flex items-center gap-2 flex-1 bg-surface-container px-3 py-2 rounded-xl border border-outline-variant">
          <span class="material-symbols-outlined text-primary">search</span>
          <input 
            type="text" 
            id="menu-search-input"
            placeholder="Buscar por nombre, salsa o ingrediente..." 
            class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant focus:outline-none text-sm"
          />
        </div>
        <button 
          type="button" 
          id="close-search-btn"
          class="p-2 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-variant transition-colors"
        >
          <span class="material-symbols-outlined text-2xl">close</span>
        </button>
      </div>

      <div id="search-results-list" class="flex-1 overflow-y-auto custom-scrollbar pt-4 space-y-3">
        <p class="text-center text-xs text-on-surface-variant py-8">Escribe algo para buscar en toda la carta de Weekend!...</p>
      </div>
    </div>
  </div>

  <!-- Dynamic Cart Floating Widget (Desktop Only) -->
  <div id="floating-cart-widget" class="fixed bottom-10 right-6 z-40 hidden md:flex items-center justify-end">
    <div id="cart-floating-pill" class="bg-surface-container-high border border-primary-container p-3 rounded-2xl shadow-[0_0_30px_rgba(164,198,57,0.25)] flex items-center space-x-md backdrop-blur-md">
      <div class="flex flex-col pl-2">
        <span class="text-[11px] font-label-bold text-on-surface-variant uppercase">Total Pedido</span>
        <span id="floating-cart-total" class="text-price-display font-price-display text-primary text-xl font-bold">S/ 0.00</span>
      </div>
      <button 
        type="button"
        id="cart-floating-btn"
        data-action="open-cart"
        class="bg-primary hover:bg-primary-container text-black font-label-bold text-xs uppercase px-5 py-3 rounded-xl flex items-center space-x-2 font-extrabold shadow-md transition-all active:scale-95"
      >
        <span>Ver Carrito</span>
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>
    </div>
  </div>

  <!-- Bottom Navigation Bar (Mobile) -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-sm pb-gutter pt-2.5 bg-surface-container/95 backdrop-blur-md border-t border-outline-variant shadow-[0_-4px_20px_rgba(164,198,57,0.15)]">
    <button 
      type="button"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
      class="flex flex-col items-center justify-center text-primary px-3 py-1.5 transition-transform active:scale-95"
    >
      <span class="material-symbols-outlined text-[24px] mb-0.5">fastfood</span>
      <span class="text-label-bold font-label-bold text-[10px] uppercase">Menú</span>
    </button>
    <button 
      type="button"
      onclick="document.getElementById('alitas')?.scrollIntoView({behavior: 'smooth'})"
      class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:text-primary transition-colors active:scale-95"
    >
      <span class="material-symbols-outlined text-[24px] mb-0.5">lunch_dining</span>
      <span class="text-label-bold font-label-bold text-[10px] uppercase">Alitas</span>
    </button>
    <button 
      type="button"
      onclick="document.getElementById('combos-voladores')?.scrollIntoView({behavior: 'smooth'})"
      class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1.5 hover:text-primary transition-colors active:scale-95"
    >
      <span class="material-symbols-outlined text-[24px] mb-0.5">military_tech</span>
      <span class="text-label-bold font-label-bold text-[10px] uppercase">Combos</span>
    </button>
    <button 
      type="button"
      data-action="open-cart"
      id="cart-icon-btn"
      class="flex flex-col items-center justify-center text-primary px-3 py-1.5 hover:text-primary transition-colors relative active:scale-95"
    >
      <span id="mobile-cart-badge" class="absolute top-0 right-3 min-w-[18px] h-[18px] px-1 bg-primary text-black font-extrabold text-[10px] rounded-full flex items-center justify-center hidden animate-bounce">
        0
      </span>
      <span class="material-symbols-outlined text-[24px] mb-0.5">shopping_cart_checkout</span>
      <span class="text-label-bold font-label-bold text-[10px] uppercase">Carrito</span>
    </button>
  </nav>

  <!-- React Container (Optional fallback) -->
  <div id="root"></div>

  <!-- Main Composition Root Module -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
